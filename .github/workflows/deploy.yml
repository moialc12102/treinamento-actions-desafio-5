name: check and deploy aplication

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: generate lock file
      run: npm install --package-lock-only --ignore-scripts

    - name: install dependencies
      run: npm ci

    - name: run lint
      run: npm run lint
    
    - name: confirme lint
      run: echo "Linting completed successfully"

  teste:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.coverage.outputs.total }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
      
    - name: generate lock file
      run: npm install --package-lock-only --ignore-scripts

    - name: install dependencies
      run: npm ci

    - name: run tests
      run: npm run test -- --coverage --coverageReporters=json-summary

    - name: export coverage
      id: coverage
      run: |
        total=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
        echo "total=$total" >> "$GITHUB_OUTPUT"
        echo "Cobertura de linhas: $total%"

    - name: confirme tests
      run: echo "Tests completed successfully"

  deploy:
    needs: teste
    runs-on: ubuntu-latest
    if: ${{ fromJSON(needs.teste.outputs.total) >= 80 }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
      
    - name: generate lock file
      run: npm install --package-lock-only --ignore-scripts

    - name: install dependencies
      run: npm ci

    - name: deploy application
      run: npm run deploy

    - name: confirme deploy
      run: echo "Deploy completed successfully"