name: check and deploy aplication

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: install dependencies
      run: npm install --package-lock-only --ignore-scripts
